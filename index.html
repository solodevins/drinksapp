<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Каталог напитков</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #18181c);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #24242a);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px 12px 100px 12px;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--hint-color);
        }

        /* Горизонтальные табы-фильтры */
        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--secondary-bg);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--button-color);
            color: var(--button-text);
            border-color: var(--button-color);
            box-shadow: 0 2px 10px rgba(46, 166, 255, 0.35);
        }

        /* Сетка карточек */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            background: var(--secondary-bg);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid transparent;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transition: transform 0.15s ease, border-color 0.2s ease;
            cursor: pointer;
        }

        .card:active {
            transform: scale(0.97);
        }

        .card.selected {
            border-color: var(--button-color);
            box-shadow: 0 0 16px rgba(46, 166, 255, 0.4);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 70%;
            background: #111;
        }

        .card-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            padding: 3px 7px;
            border-radius: 10px;
        }

        .card-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 11px;
            color: var(--hint-color);
            line-height: 1.3;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Кнопки-ссылки */
        .links-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 10px;
        }

        .mini-link {
            font-size: 10px;
            color: var(--button-color);
            background: rgba(46, 166, 255, 0.12);
            padding: 4px 6px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .price {
            font-size: 14px;
            font-weight: 700;
            color: var(--button-color);
        }

        .select-btn {
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-color);
            font-weight: 600;
            font-size: 11px;
            padding: 5px 9px;
            border-radius: 6px;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .card.selected .select-btn {
            background: var(--button-color);
            color: var(--button-text);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Каталог напитков</h1>
        <p>Вариант 18 • Выберите позицию</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterCategory('all', this)">Все</button>
        <button class="tab-btn" onclick="filterCategory('soda', this)">🥤 Газировки</button>
        <button class="tab-btn" onclick="filterCategory('tea', this)">🍵 Чай</button>
        <button class="tab-btn" onclick="filterCategory('cocktails', this)">🍸 Коктейли</button>
    </div>

    <div class="container" id="drinks-container"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Данные напитков из drinks.db
        const drinksData = [
            {
                id: "1",
                category: "soda",
                badge: "Газировка",
                name: "Добрый Кола",
                desc: "Классический освежающий газированный напиток.",
                price: "89 ₽",
                image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=400&q=80",
                buy_url: "https://samokat.ru/search?q=%D0%A1%D0%B0%D0%BC%D0%B0%D1%80%D0%B0+%D0%94%D0%BE%D0%B1%D1%80%D1%8B%D0%B9+%D0%9A%D0%BE%D0%BB%D0%B0"
            },
            {
                id: "2",
                category: "soda",
                badge: "Газировка",
                name: "Evervess Cola",
                desc: "Сильногазированный напиток, прекрасно утоляющий жажду.",
                price: "99 ₽",
                image: "https://images.unsplash.com/photo-1554866585-cd94860890b7?w=400&q=80",
                buy_url: "https://samokat.ru/search?q=%D0%A1%D0%B0%D0%BC%D0%B0%D1%80%D0%B0+Evervess"
            },
            {
                id: "3",
                category: "soda",
                badge: "Газировка",
                name: "Добрый Лимон-Лайм",
                desc: "Прозрачный напиток с ярким цитрусовым вкусом.",
                price: "89 ₽",
                image: "https://images.unsplash.com/photo-1625772299848-391b6a87d7b3?w=400&q=80",
                buy_url: "https://samokat.ru/search?q=%D0%A1%D0%B0%D0%BC%D0%B0%D1%80%D0%B0+%D0%94%D0%BE%D0%B1%D1%80%D1%8B%D0%B9+%D0%9B%D0%B8%D0%BC%D0%BE%D0%BD-%D0%9B%D0%B0%D0%B9%D0%BC"
            },
            {
                id: "4",
                category: "tea",
                badge: "Чай",
                name: "Lipton Зеленый",
                desc: "Холодный зеленый чай. Приятно освежает и тонизирует.",
                price: "110 ₽",
                image: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400&q=80",
                buy_url: "https://samokat.ru/search?q=%D0%A1%D0%B0%D0%BC%D0%B0%D1%80%D0%B0+Lipton+%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D1%8B%D0%B9+%D1%87%D0%B0%D0%B9"
            },
            {
                id: "5",
                category: "tea",
                badge: "Чай",
                name: "Горячий зеленый чай",
                desc: "Традиционный горячий зеленый чай в пакетиках.",
                price: "79 ₽",
                image: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=400&q=80",
                buy_url: "https://samokat.ru/search?q=%D0%A1%D0%B0%D0%BC%D0%B0%D1%80%D0%B0+%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D1%8B%D0%B9+%D1%87%D0%B0%D0%B9"
            },
            {
                id: "6",
                category: "cocktails",
                badge: "Коктейль",
                name: "Мохито б/а",
                desc: "Освежающий напиток с мятой, лаймом и содовой.",
                price: "250 ₽",
                image: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400&q=80",
                map_url: "https://yandex.ru/maps/?text=%D0%A1%D0%B0%D0%BC%D0%B0%D1%80%D0%B0%2C+%D0%B1%D0%B0%D1%80",
                video_url: "https://www.youtube.com/results?search_query=%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82+%D0%B1%D0%B5%D0%B7%D0%B0%D0%BB%D0%BA%D0%BE%D0%B3%D0%BE%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9+%D0%BC%D0%BE%D1%85%D0%B8%D1%82%D0%BE"
            },
            {
                id: "7",
                category: "cocktails",
                badge: "Коктейль",
                name: "Бамбл кофе",
                desc: "Эспрессо, апельсиновый сок и карамельный сироп со льдом.",
                price: "220 ₽",
                image: "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=400&q=80",
                map_url: "https://yandex.ru/maps/?text=%D0%A1%D0%B0%D0%BC%D0%B0%D1%80%D0%B0%2C+%D0%BA%D0%BE%D1%84%D0%B5%D0%B9%D0%BD%D1%8F",
                video_url: "https://www.youtube.com/results?search_query=%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82+%D0%B1%D0%B0%D0%BC%D0%B1%D0%BB+%D0%BA%D0%BE%D1%84%D0%B5"
            }
        ];

        let selectedDrinkId = null;
        let currentFilter = 'all';

        function renderCards() {
            const container = document.getElementById("drinks-container");
            container.innerHTML = "";

            const filtered = currentFilter === "all" 
                ? drinksData 
                : drinksData.filter(d => d.category === currentFilter);

            filtered.forEach(drink => {
                const card = document.createElement("div");
                card.className = `card ${selectedDrinkId === drink.id ? 'selected' : ''}`;
                
                let linksHtml = '<div class="links-group">';
                if (drink.buy_url) linksHtml += `<a href="${drink.buy_url}" target="_blank" class="mini-link" onclick="event.stopPropagation()">🛒 Самокат</a>`;
                if (drink.map_url) linksHtml += `<a href="${drink.map_url}" target="_blank" class="mini-link" onclick="event.stopPropagation()">📍 Карта</a>`;
                if (drink.video_url) linksHtml += `<a href="${drink.video_url}" target="_blank" class="mini-link" onclick="event.stopPropagation()">🎥 Видео</a>`;
                linksHtml += '</div>';

                card.innerHTML = `
                    <div class="image-wrapper">
                        <img src="${drink.image}" alt="${drink.name}" class="card-img">
                        <span class="badge">${drink.badge}</span>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${drink.name}</h3>
                        <p class="card-desc">${drink.desc}</p>
                        ${linksHtml}
                        <div class="card-footer">
                            <span class="price">${drink.price}</span>
                            <button class="select-btn">${selectedDrinkId === drink.id ? 'Выбрано' : 'Выбрать'}</button>
                        </div>
                    </div>
                `;

                card.addEventListener("click", () => {
                    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");

                    if (selectedDrinkId === drink.id) {
                        selectedDrinkId = null;
                        if (tg?.MainButton) tg.MainButton.hide();
                    } else {
                        selectedDrinkId = drink.id;
                        if (tg?.MainButton) {
                            tg.MainButton.setText(`Отправить в чат: ${drink.name}`);
                            tg.MainButton.show();
                        }
                    }
                    renderCards();
                });

                container.appendChild(card);
            });
        }

        function filterCategory(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderCards();
        }


if (tg?.MainButton) {
    tg.MainButton.onClick(() => {
        if (selectedDrinkId) {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
            tg.sendData(String(selectedDrinkId));
        }
    });
}
        // Первичный запуск отрисовки
        renderCards();
    </script>
</body>
</html>
