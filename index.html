<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <title>Каталог напитков</title>
</head>
<body>
    <div class="header">
        <h1>Каталог напитков</h1>
        <p>Вариант 18 • Выберите позицию</p>
    </div>

    <!-- Вкладки категорий для быстрой фильтрации -->
    <div class="tabs-container">
        <button class="tab-btn active" data-category="all">Все</button>
        <button class="tab-btn" data-category="soda">🥤 Газировки</button>
        <button class="tab-btn" data-category="tea">🍵 Чай</button>
        <button class="tab-btn" data-category="cocktails">🍸 Коктейли</button>
    </div>

    <!-- Контейнер для карточек напитков -->
    <div class="container" id="drinks-container">
        <!-- Генерируется автоматически из app.js -->
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
