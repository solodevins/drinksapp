<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Каталог напитков</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #18181c);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #24242a);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px 12px 100px 12px;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--hint-color);
        }

        /* Горизонтальные табы-фильтры */
        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--secondary-bg);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--button-color);
            color: var(--button-text);
            border-color: var(--button-color);
            box-shadow: 0 2px 10px rgba(46, 166, 255, 0.35);
        }

        /* Сетка карточек */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            background: var(--secondary-bg);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid transparent;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transition: transform 0.15s ease, border-color 0.2s ease;
            cursor: pointer;
        }

        .card:active {
            transform: scale(0.97);
        }

        .card.selected {
            border-color: var(--button-color);
            box-shadow: 0 0 16px rgba(46, 166, 255, 0.4);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 70%;
            background: #111;
        }

        .card-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            padding: 3px 7px;
            border-radius: 10px;
        }

        .card-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 11px;
            color: var(--hint-color);
            line-height: 1.3;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Кнопки-ссылки */
        .links-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 10px;
        }

        .mini-link {
            font-size: 10px;
            color: var(--button-color);
            background: rgba(46, 166, 255, 0.12);
            padding: 4px 6px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .price {
            font-size: 14px;
            font-weight: 700;
            color: var(--button-color);
        }

        .select-btn {
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-color);
            font-weight: 600;
            font-size: 11px;
            padding: 5px 9px;
            border-radius: 6px;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .card.selected .select-btn {
            background: var(--button-color);
            color: var(--button-text);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Каталог напитков</h1>
        <p>Вариант 18 • Выберите позицию</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterCategory('all', this)">Все</button>
        <button class="tab-btn" onclick="filterCategory('soda', this)">🥤 Газировки</button>
        <button class="tab-btn" onclick="filterCategory('tea', this)">🍵 Чай</button>
        <button class="tab-btn" onclick="filterCategory('cocktails', this)">🍸 Коктейли</button>
    </div>

    <div class="container" id="drinks-container"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
